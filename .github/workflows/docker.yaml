name: Docker-Skopeo-Copy-Hosted
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Skopeo-Transfer
    runs-on: ubuntu-latest
    steps:
      - name: Before free space
        run: |
          echo "Before clean"
          df -hT

      # 原版自带的清理动作，在托管机上生效，释放更多root空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'

      - name: After free space
        run: |
          echo "After clean"
          df -hT

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Skopeo copy transfer
        run: |
          set -euo pipefail
          skopeo login --username "${ALIYUN_REGISTRY_USER}" --password "${ALIYUN_REGISTRY_PASSWORD}" "${ALIYUN_REGISTRY}"

          declare -A duplicate_images
          declare -A temp_map

          # 第一轮扫描，找出重名镜像
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
              continue
            fi
            image=$(echo "$line" | awk '{for(i=1;i<=NF;i++){if($i !~ /^--platform/) printf "%s ",$i}; print ""}' | xargs)
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            # 重点修改：${temp_map[$image_name]:-} 不存在返回空，不会触发 -u
            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          # 第二轮批量复制
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
              continue
            fi

            echo "======================================"
            echo "Processing line: $line"

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            src_image=$(echo "$line" | awk '{for(i=1;i<=NF;i++){if($i !~ /^--platform/) printf "%s ",$i}; print ""}' | xargs)
            src_image="${src_image%%@*}"

            echo "src_image: $src_image"
            echo "platform: $platform"

            image_name_tag=$(echo "$src_image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$src_image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            # 这里同样加上 :-
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
              if [[ -n "${name_space}" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            if [ -z "$platform" ]; then
              platform_prefix=""
              platform_arg=""
            else
              platform_prefix="${platform//\//_}_"
              platform_arg="--platform ${platform}"
            fi

            dest_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${name_space_prefix}${image_name_tag}"
            echo "dest_image: $dest_image"

            skopeo copy ${platform_arg} \
              "docker://${src_image}" \
              "docker://${dest_image}"

            echo "✅ Transfer done: ${src_image} -> ${dest_image}"
            echo "======================================"
          done < images.txt

          skopeo logout "${ALIYUN_REGISTRY}"
